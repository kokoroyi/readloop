name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 代码规范
        run: npm run lint
      - name: 单元 + 集成测试
        run: npm test
      - name: 前端构建
        run: npm run build

